<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tileserve-go login</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    min-height: 100vh;
    margin: 0;
    align-items: center;
    justify-content: center;
  }
  .card {
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 320px;
  }
  h1 { font-size: 1.1rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem;
    margin-bottom: 0.9rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 0.55rem;
    border: none;
    border-radius: 4px;
    background: #2563eb;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #result { margin-top: 1rem; }
  #token {
    width: 100%;
    box-sizing: border-box;
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    padding: 0.5rem;
    resize: vertical;
  }
  #error { color: #dc2626; font-size: 0.85rem; margin-top: 0.75rem; }
  #copy { margin-top: 0.5rem; background: #444; }
  #sso { margin-top: 0.75rem; background: #444; }
  .hidden { display: none; }
  footer {
    position: fixed;
    bottom: 0.75rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    opacity: 0.7;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in to get a token</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label for="ttl">Token lifetime (seconds, optional)</label>
      <input id="ttl" name="ttl" type="number" min="1" placeholder="default">
      <button type="submit" id="submit">Sign in</button>
    </form>
    <button type="button" id="sso" class="hidden">Sign in with SSO</button>
    <p id="error" class="hidden"></p>
    <div id="result" class="hidden">
      <label for="token">JWT</label>
      <textarea id="token" rows="5" readonly></textarea>
      <button id="copy" type="button">Copy to clipboard</button>
    </div>
  </div>
  <footer>
    &copy; 2026 Witt, Nils &middot; Tileserve-GO &middot; <a href="https://github.com/Nils-witt/Tileserve-GO" target="_blank" rel="noopener noreferrer">GitHub</a><span id="build-info"></span>
  </footer>
  <script src="/login.js"></script>
</body>
</html>

openapi: 3.0.3
info:
  title: tileserve-go
  description: >
    A small Go HTTP server for managing maps and their versioned tile uploads,
    backed by Postgres and secured with JWT authentication. Maps have
    versioned zip uploads extracted to `<data-root>/<uuid>/<version>/` on
    disk, served back at `/maps/{id}/version/{version}/...`.
  version: "1.0.0"
servers:
  - url: http://localhost:8085

tags:
  - name: auth
    description: Login and token issuance
  - name: maps
    description: CRUD and version uploads for maps
  - name: geo-objects
    description: CRUD for geo objects (addresses/points of interest) tied to a map version
  - name: users
    description: Admin-only user account management
  - name: api-keys
    description: Admin-only API key management, for server-to-server authentication
  - name: sync
    description: Admin-only configuration and control of pulling a full mirror from remote tileserve-go instances
  - name: files
    description: Serving extracted map/tile files
  - name: ui
    description: Browser-based management UI
  - name: health
    description: Health check

security:
  - bearerAuth: []
  - tokenQuery: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /login:
    get:
      tags: [auth]
      summary: Login page
      description: Returns a self-contained HTML page with a sign-in form that obtains a JWT.
      security: []
      responses:
        "200":
          description: HTML login page
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Invalid credentials
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new JWT
      description: >-
        Redeems a refresh token (issued by POST /login or a previous call to
        this endpoint) for a new login JWT, without re-sending credentials.
        The refresh token is single-use: this call also revokes it and
        returns a new one to use next time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Invalid, expired, or already-used refresh token
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /ui/:
    get:
      tags: [ui]
      summary: Management UI
      description: >-
        Self-contained HTML/JS page for managing maps (create/edit/delete,
        upload versions, view history). The page itself is public; it signs
        in via POST /login and drives the rest of this API with the
        resulting token.
      security: []
      responses:
        "200":
          description: HTML management UI
          content:
            text/html:
              schema:
                type: string

  /maps:
    get:
      tags: [maps]
      summary: List maps
      description: >-
        Returns only the maps the acting user may see: maps marked
        `visibleToAll`, maps they created, maps they hold a per-map
        view/edit/delete grant on, admins, and users whose global `can_edit`
        or `can_delete` permission already lets them act on every map.
      parameters:
        - name: name
          in: query
          description: Case-insensitive substring match on the map name.
          schema:
            type: string
        - name: createdBy
          in: query
          description: Exact match on the username that created the map.
          schema:
            type: string
        - name: visibleToAll
          in: query
          schema:
            type: boolean
        - name: anonymousAllowed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Array of visible maps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Map"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [maps]
      summary: Create a map
      description: Requires the acting user's `can_create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapRequest"
      responses:
        "201":
          description: Map created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Invalid request body or missing name
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /maps/{id}:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: Get a map
      description: Requires view access to this map (see `GET /maps`); returns 403 if the map is private and the acting user can't see it.
      responses:
        "200":
          description: The map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Invalid map id
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [maps]
      summary: Replace a map's name/currentVersion/visibleToAll/anonymousAllowed
      description: >
        Requires the acting user's `can_edit` permission (global or per-map).
        `name`, `currentVersion`, `visibleToAll`, and `anonymousAllowed` are
        replaced; this does not touch the map_versions history or any
        extracted files on disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapRequest"
      responses:
        "200":
          description: Updated map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Invalid request body or missing name
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [maps]
      summary: Delete a map
      description: Requires the acting user's `can_delete` permission. Cascades and deletes the map's version history.
      responses:
        "204":
          description: Map deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /maps/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: List a map's upload history
      description: >-
        Returns every version ever uploaded for this map, most recent first.
        Requires view access to this map (see `GET /maps`).
      responses:
        "200":
          description: Array of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /maps/{id}/upload:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [maps]
      summary: Upload a new map version
      description: >
        Requires the acting user's `can_create` permission. The request body
        is a zip file (max 1 GiB), extracted to
        `<data-root>/<uuid>/<version>/`. `<version>` is one more than the
        highest version recorded in this map's history (0 if none yet); it is
        never derived from the map's `currentVersion` field. On success both
        `maps.current_version` and a new `map_versions` row are written
        atomically. The zip's contents should form a numeric tile pyramid:
        every directory name must be all digits, and every file must be named
        `<number>.png` (e.g. `3/1/2.png`, or `5.png` at the top level).
        Entries that don't match this (or are symlinks, or attempt path
        traversal) are silently skipped rather than failing the upload; the
        version is still created from whatever did extract successfully.
        After extraction, an `index.json` listing every `{z, x, y}` tile
        found (sorted by z, then x, then y) is written alongside the tiles
        and served like any other file under this version.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Version stored; returns the map with its updated currentVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Unreadable zip archive
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Upload exceeds the 1 GiB limit
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maps/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: List a map's per-user permission grants
      description: >-
        Requires the acting user's `is_admin` permission, same as the global
        Users API. A grant only adds `can_view`/`can_edit`/`can_delete`
        capability for that specific map on top of the user's global
        permissions — it never removes capability a user's global flags
        already give them.
      responses:
        "200":
          description: Array of grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapPermission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /maps/{id}/permissions/{username}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: username
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [maps]
      summary: Grant or replace a user's per-map permission
      description: Requires the acting user's `is_admin` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapPermissionRequest"
      responses:
        "200":
          description: Grant created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPermission"
        "400":
          description: Invalid request body, or the map/username doesn't exist
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [maps]
      summary: Revoke a user's per-map permission
      description: Requires the acting user's `is_admin` permission. A no-op if no grant exists.
      responses:
        "204":
          description: Grant revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /maps/{id}/aliases:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: List a map's user-defined version aliases
      description: >-
        Requires view access to this map (see `GET /maps`). Aliases let a
        `{version}` path segment elsewhere resolve to a specific uploaded
        version by name, alongside the built-in `current` keyword.
      responses:
        "200":
          description: Array of aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapVersionAlias"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /maps/{id}/aliases/{alias}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: alias
        in: path
        required: true
        schema:
          type: string
        description: >-
          The alias name. May not be the literal keyword "current" or
          purely numeric (both are reserved for the built-in version
          resolution rules).
    get:
      tags: [maps]
      summary: Fetch a single version alias
      description: Requires view access to this map (see `GET /maps`).
      responses:
        "200":
          description: The alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapVersionAlias"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such alias for this map
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    put:
      tags: [maps]
      summary: Create or replace a version alias
      description: >-
        Requires the acting user's `can_edit` permission (global or
        per-map) — the same rule as editing a map's `currentVersion` via
        `PUT /maps/{id}`. Unlike the permissions API, this is not
        admin-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapVersionAliasRequest"
      responses:
        "200":
          description: Alias created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapVersionAlias"
        "400":
          description: >-
            Invalid request body, alias is "current" or purely numeric, or
            the referenced version doesn't exist for this map
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [maps]
      summary: Delete a version alias
      description: Requires the acting user's `can_edit` permission. A no-op if no such alias exists.
      responses:
        "204":
          description: Alias deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      tags: [users]
      summary: List users
      description: Requires the acting user's `is_admin` permission. Responses never include the password hash.
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring match against username OR cn.
          schema:
            type: string
        - name: isAdmin
          in: query
          schema:
            type: boolean
        - name: canCreate
          in: query
          schema:
            type: boolean
        - name: canEdit
          in: query
          schema:
            type: boolean
        - name: canDelete
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: Create a user
      description: Requires the acting user's `is_admin` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body, or missing username/password
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already taken
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [users]
      summary: Update a user's permissions (and optionally password)
      description: >-
        Requires the acting user's `is_admin` permission. All four permission
        flags are replaced (not partial); `password` is optional and, when
        omitted or empty, leaves the existing password unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      tags: [users]
      summary: Delete a user
      description: Requires the acting user's `is_admin` permission. You cannot delete your own account.
      responses:
        "204":
          description: User deleted
        "400":
          description: Attempted to delete your own account
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /users/{username}/api-keys:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [api-keys]
      summary: List a user's API keys
      description: >-
        Requires the acting user's `is_admin` permission. Never includes the
        plaintext key — that's returned only once, at creation.
      responses:
        "200":
          description: Array of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-keys]
      summary: Create an API key for a user
      description: >-
        Requires the acting user's `is_admin` permission. The created key
        authenticates as the target user (their full global and per-map
        permissions apply) — intended for a service account used by a
        remote tileserve-go instance's sync puller (see `POST
        /sync/remotes`), not for human login. The plaintext key is returned
        exactly once, in this response; it cannot be recovered afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /users/{username}/api-keys/{id}:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [api-keys]
      summary: Revoke an API key
      description: Requires the acting user's `is_admin` permission.
      responses:
        "204":
          description: API key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: API key not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /sync/remotes:
    get:
      tags: [sync]
      summary: List configured sync remotes
      description: >-
        Requires the acting user's `is_admin` permission. Never includes
        `apiKey` — the credential this server presents to the remote.
      responses:
        "200":
          description: Array of sync remotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRemote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [sync]
      summary: Register a remote to pull a full mirror from
      description: >-
        Requires the acting user's `is_admin` permission. Once created and
        enabled, this server periodically (every `pollIntervalSec`) pulls
        every map visible to `apiKey` on the remote — including every
        version and alias, mirrored under the same map UUIDs — via `GET
        /maps`, `GET /maps/{id}/versions`, `GET
        /maps/{id}/version/{version}/archive`, and `GET
        /maps/{id}/aliases` on the remote. `apiKey` should be one issued by
        `POST /users/{username}/api-keys` on the remote instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRemoteRequest"
      responses:
        "201":
          description: Sync remote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemote"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sync/remotes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [sync]
      summary: Get a sync remote
      description: Requires the acting user's `is_admin` permission.
      responses:
        "200":
          description: The sync remote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Sync remote not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    put:
      tags: [sync]
      summary: Replace a sync remote's configuration
      description: >-
        Requires the acting user's `is_admin` permission. Changing
        `baseUrl`, `apiKey`, or `pollIntervalSec` on a currently-running
        remote restarts its background sync worker with the new
        configuration (within ~30s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRemoteRequest"
      responses:
        "200":
          description: Updated sync remote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemote"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Sync remote not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      tags: [sync]
      summary: Remove a sync remote
      description: >-
        Requires the acting user's `is_admin` permission. Stops future
        syncing from this remote; maps already mirrored from it keep their
        local data.
      responses:
        "204":
          description: Sync remote deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Sync remote not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /sync/remotes/{id}/trigger:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [sync]
      summary: Trigger an immediate sync
      description: >-
        Requires the acting user's `is_admin` permission. Asks the remote's
        running background worker to sync now, outside its regular
        `pollIntervalSec` interval. Returns 409 if the remote has no active
        worker (it doesn't exist, or is disabled).
      responses:
        "202":
          description: Sync triggered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Sync remote is not currently running
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maps/{id}/version/{version}/bounds:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: >-
          A real (numeric) version identifier, the literal keyword
          "current" (resolves to the map's currentVersion), or a
          user-defined alias created via `PUT /maps/{id}/aliases/{alias}`.
    get:
      tags: [files]
      summary: Compute the real-world extent of a map version's tile pyramid
      description: >-
        Scans the extracted `z/x/y.png` files under
        `<data-root>/<id>/<version>/` (no bounds are stored) and returns the
        lon/lat bounding box, derived from the tiles at the lowest zoom level
        present, plus that level as `minZoom` and the highest level present as
        `maxZoom`. Intended for initializing a preview map's view. Requires
        view access to this map (see `GET /maps`); no `can_*` action
        permission is required.
      responses:
        "200":
          description: Computed bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TileBounds"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Version not found or has no tiles

  /maps/{id}/version/{version}/archive:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: >-
          A real (numeric) version identifier, the literal keyword
          "current" (resolves to the map's currentVersion), or a
          user-defined alias created via `PUT /maps/{id}/aliases/{alias}`.
    get:
      tags: [files, sync]
      summary: Download a whole map version as a zip archive
      description: >-
        Streams every file under `<data-root>/<id>/<version>/` (tiles plus
        `index.json`) as a single zip, so a puller can fetch a whole version
        in one request instead of one per tile file. This is the endpoint a
        remote tileserve-go instance calls when another instance configures
        it as a sync source (see `POST /sync/remotes`). Requires view access
        to this map (see `GET /maps`); unlike the raw tile-file route, this
        is never reachable anonymously even if `anonymousAllowed` is set.
      responses:
        "200":
          description: Zip archive of the version's contents
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Map or version not found

  /maps/{id}/version/{version}/geo-objects:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: >-
          A real (numeric) version identifier, the literal keyword
          "current" (resolves to the map's currentVersion), or a
          user-defined alias created via `PUT /maps/{id}/aliases/{alias}`.
    get:
      tags: [geo-objects]
      summary: List a map version's geo objects
      description: Requires view access to this map (see `GET /maps`).
      parameters:
        - name: name
          in: query
          description: Case-insensitive substring match on the geo object name.
          schema:
            type: string
        - name: externalId
          in: query
          description: Exact match on externalId.
          schema:
            type: string
        - name: street
          in: query
          description: Case-insensitive substring match on street.
          schema:
            type: string
        - name: postcode
          in: query
          description: Exact match on postcode.
          schema:
            type: string
        - name: createdBy
          in: query
          description: Exact match on the username that created the geo object.
          schema:
            type: string
        - name: minLat
          in: query
          description: Bounding box filter. Must be given together with maxLat, minLon, and maxLon.
          schema:
            type: number
        - name: maxLat
          in: query
          description: Bounding box filter. Must be given together with minLat, minLon, and maxLon.
          schema:
            type: number
        - name: minLon
          in: query
          description: Bounding box filter. Must be given together with minLat, maxLat, and maxLon.
          schema:
            type: number
        - name: maxLon
          in: query
          description: Bounding box filter. Must be given together with minLat, maxLat, and minLon.
          schema:
            type: number
      responses:
        "200":
          description: Array of geo objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeoObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [geo-objects]
      summary: Create a geo object
      description: Requires the acting user's `can_edit` permission (global or per-map).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoObjectRequest"
      responses:
        "201":
          description: Geo object created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "400":
          description: Invalid request body, missing name/latitude/longitude, or the map/version doesn't exist
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /maps/{id}/version/{version}/geo-objects/{geoObjectId}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: >-
          A real (numeric) version identifier, the literal keyword
          "current" (resolves to the map's currentVersion), or a
          user-defined alias created via `PUT /maps/{id}/aliases/{alias}`.
      - name: geoObjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [geo-objects]
      summary: Get a geo object
      description: Requires view access to this map (see `GET /maps`).
      responses:
        "200":
          description: The geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "400":
          description: Invalid map or geo object id
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [geo-objects]
      summary: Replace a geo object's fields
      description: >-
        Requires the acting user's `can_edit` permission (global or per-map).
        The geo object's map and version are immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoObjectRequest"
      responses:
        "200":
          description: Updated geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "400":
          description: Invalid request body or missing name/latitude/longitude
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [geo-objects]
      summary: Delete a geo object
      description: Requires the acting user's `can_delete` permission (global or per-map).
      responses:
        "204":
          description: Geo object deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /maps/{id}/version/{version}/{filePath}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: >-
          A real (numeric) version identifier, the literal keyword
          "current" (resolves to the map's currentVersion), or a
          user-defined alias created via `PUT /maps/{id}/aliases/{alias}`.
      - name: filePath
        in: path
        required: true
        schema:
          type: string
        description: >
          Path of the file within this version's extracted contents, e.g.
          `0/0/0.png`. This template represents one segment for documentation
          purposes; the server actually serves arbitrarily nested paths under
          `<data-root>/<id>/<version>/`.
    get:
      tags: [files]
      summary: Fetch an extracted tile file from a map version
      security: []
      description: >-
        Serves files straight out of `<data-root>/<id>/<version>/`. If the
        map has `anonymousAllowed` set, this one endpoint may be called with
        no bearer token at all; otherwise it requires view access to the map
        (see `GET /maps`), same as every other read endpoint — no `can_*`
        action permission is required either way.
      responses:
        "200":
          description: File contents
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Version or file not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: JWT passed as a query parameter instead of the Authorization header.

  parameters:
    MapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: Acting user lacks the required permission
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: Map not found
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"

  schemas:
    ErrorMessage:
      type: string
      description: Plain-text error message.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        ttl_seconds:
          type: integer
          format: int64
          description: Requested token lifetime in seconds. Defaults to 24h; capped at 7 days.
          example: 3600

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
          description: >-
            Single-use token that can be redeemed at POST /refresh for a new
            login token (and a new refresh token) without re-authenticating.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    MapRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        currentVersion:
          type: string
        visibleToAll:
          type: boolean
          description: Whether every authenticated user can see this map. Defaults to false (private) if omitted.
        anonymousAllowed:
          type: boolean
          description: >-
            Whether GET /maps/{id}/version/{version}/* (raw tile files) may
            be fetched with no bearer token at all. Independent of
            `visibleToAll` — a map can be private to authenticated users yet
            still serve tiles anonymously, or vice versa. Defaults to false
            if omitted.

    Map:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        currentVersion:
          type: string
        visibleToAll:
          type: boolean
          description: >-
            Whether every authenticated user can see this map. When false,
            only admins, the creator, users whose global `can_edit`/`can_delete`
            already lets them act on any map, and users with a per-map grant
            can see it.
        anonymousAllowed:
          type: boolean
          description: >-
            Whether this map's tile files can be fetched with no bearer
            token at all (see `GET /maps/{id}/version/{version}/{filePath}`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string

    MapVersion:
      type: object
      properties:
        version:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    GeoObjectRequest:
      type: object
      required: [name, latitude, longitude]
      properties:
        name:
          type: string
        externalId:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        street:
          type: string
        housenumber:
          type: string
        postcode:
          type: string

    GeoObject:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        mapUuid:
          type: string
          format: uuid
        version:
          type: string
        name:
          type: string
        externalId:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        street:
          type: string
        housenumber:
          type: string
        postcode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string

    TileBounds:
      type: object
      properties:
        minZoom:
          type: integer
          description: Lowest zoom level with tiles on disk; used as the bounding box source.
        maxZoom:
          type: integer
          description: Highest zoom level with tiles on disk.
        west:
          type: number
          format: double
        south:
          type: number
          format: double
        east:
          type: number
          format: double
        north:
          type: number
          format: double
        centerLng:
          type: number
          format: double
        centerLat:
          type: number
          format: double

    UserRequest:
      type: object
      required: [canCreate, canEdit, canDelete, isAdmin]
      properties:
        username:
          type: string
          description: Required when creating a user; ignored on update (the path parameter is authoritative).
        password:
          type: string
          description: Required when creating a user. On update, optional — omit or leave empty to keep the current password.
        canCreate:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        isAdmin:
          type: boolean

    User:
      type: object
      properties:
        username:
          type: string
        canCreate:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MapPermissionRequest:
      type: object
      required: [canView, canEdit, canDelete]
      properties:
        canView:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean

    MapPermission:
      type: object
      properties:
        username:
          type: string
        canView:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string

    MapVersionAliasRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Must be an existing version in this map's upload history.

    MapVersionAlias:
      type: object
      properties:
        alias:
          type: string
        version:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string

    APIKeyRequest:
      type: object
      properties:
        name:
          type: string
          description: Human-readable label for this key (e.g. "edge-server-01 sync").

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUsedAt:
          type: string
          format: date-time

    APIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          properties:
            key:
              type: string
              description: >-
                The plaintext API key, prefixed `tsk_`. Returned exactly
                once, here; it cannot be recovered afterward. Pass it as a
                bearer token (`Authorization: Bearer tsk_...`) — accepted
                anywhere a login JWT is.

    SyncRemoteRequest:
      type: object
      required: [name, baseUrl, apiKey, pollIntervalSec]
      properties:
        name:
          type: string
        baseUrl:
          type: string
          description: Base URL of the remote tileserve-go instance, e.g. "https://source.example.com".
        apiKey:
          type: string
          description: >-
            The API key this server presents to the remote, as issued by
            `POST /users/{username}/api-keys` on that instance.
        pollIntervalSec:
          type: integer
          description: How often to sync, in seconds. Must be positive.
        enabled:
          type: boolean
          description: Whether this remote's background sync worker should run. Defaults to false if omitted.

    SyncRemote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseUrl:
          type: string
        pollIntervalSec:
          type: integer
        enabled:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
        lastSyncStatus:
          type: string
          description: '"ok" or "error" after the most recent sync attempt; empty if it has never run.'
        lastSyncError:
          type: string
          description: Error message from the most recent failed sync attempt, if any.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
